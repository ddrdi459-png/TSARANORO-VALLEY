<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — TSARANORO VALLEY</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><div id="loginBox" class="admin-login"><div class="login-logo">🌿</div><h1>TSARANORO VALLEY</h1><p>Administration sécurisée</p><input id="adminId" type="text" placeholder="Identifiant administrateur"><input id="adminPass" type="password" placeholder="Mot de passe"><button class="btn" onclick="login()">Se connecter</button><div id="loginError" class="admin-note" hidden></div></div><div id="panel" hidden><header class="admin-header"><b>🌿 TSARANORO VALLEY ADMIN</b><div><a class="btn light" href="index.html">Voir le site</a><button class="btn danger" onclick="logout()">Déconnexion</button></div></header><main class="admin-main"><nav class="tabs"><button class="tab active" onclick="showTab('hotels')">🏨 Hôtels</button><button class="tab" onclick="showTab('activities')">🏄 Activités</button><button class="tab" onclick="showTab('media')">🖼️ Galerie & Vidéo</button></nav><section id="hotels" class="admin-section"><h2>🏨 Hôtels</h2><p>Gestion complète des hébergements.</p><div id="hotelList"></div><form id="hotelForm" class="editor" hidden><h3>🏨 Fiche hébergement</h3><input type="hidden" id="hId"><input id="hName" placeholder="Nom de l'hôtel" required><input id="hPhone" placeholder="Téléphone"><input id="hWhatsApp" placeholder="WhatsApp"><input id="hWebsite" placeholder="🌐 Site web officiel"><input id="hPrice" placeholder="Tarif / indication"><textarea id="hDesc" placeholder="Description"></textarea><textarea id="hServices" placeholder="🛎️ Services / hébergement"></textarea><h4>📁 Gestion des fichiers</h4><label class="upload">📸 Ajouter plusieurs images <input id="hPhotos" type="file" accept="image/*" multiple></label><div id="hPhotoPreview"></div><label class="upload">🎥 Ajouter une vidéo MP4 <input id="hVideo" type="file" accept="video/mp4,video/webm,video/quicktime"></label><div id="hUploadProgress"></div><div class="editor-actions"><button class="btn" type="submit">💾 Enregistrer la fiche</button><button class="btn light" type="button" onclick="closeHotel()">Annuler</button></div></form></section><section id="activities" class="admin-section" hidden><h2>🏄 Activités</h2><div id="activityList"></div><form id="activityForm" class="editor" hidden><h3>🏄 Fiche activité</h3><input type="hidden" id="aId"><input id="aName" placeholder="Nom" required><textarea id="aDesc" placeholder="Description"></textarea><label class="upload">📸 Ajouter plusieurs images <input id="aPhotos" type="file" accept="image/*" multiple></label><label class="upload">🎥 Ajouter vidéo <input id="aVideo" type="file" accept="video/mp4,video/webm,video/quicktime"></label><div id="aUploadProgress"></div><button class="btn" type="submit">💾 Enregistrer</button></form></section><section id="media" class="admin-section" hidden><h2>🖼️ Galerie & Vidéo</h2><div id="mediaList"></div><form id="mediaForm" class="editor" hidden><h3>Publier un média</h3><input id="mTitle" placeholder="Titre" required><select id="mType"><option value="photo">📸 Photo</option><option value="video">🎥 Vidéo</option></select><textarea id="mDesc" placeholder="Description"></textarea><label class="upload">📁 Choisir le fichier <input id="mFile" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"></label><div id="mUploadProgress"></div><button class="btn" type="submit">☁️ Publier</button></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-final.js"></script></body></html>
