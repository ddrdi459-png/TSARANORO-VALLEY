<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TSARANORO VALLEY — Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f1e8;margin:0;color:#243126}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#315b3a;color:white}.hidden{display:none}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px}.filebox{border:2px dashed #aaa;padding:18px;border-radius:10px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button{margin-right:8px}.login{max-width:400px;margin:80px auto}.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumb img{width:130px;height:90px;object-fit:cover;border-radius:8px}</style></head><body><div id="login" class="card login"><h2>🌿 TSARANORO VALLEY ADMIN</h2><input id="uid" placeholder="Identifiant"><input id="pwd" type="password" placeholder="Mot de passe"><button class="primary" onclick="login()">Se connecter</button><p id="err"></p></div><div id="app" class="wrap hidden"><div class="actions"><h1 style="margin-right:auto">🌿 Gestion en ligne</h1><button onclick="location.href='index.html'">Voir le site</button><button onclick="logout()">Déconnexion</button></div><div class="tabs card"><button class="primary" onclick="tab('hotels')">🏨 Hôtels</button><button onclick="tab('activities')">🏄 Activités</button><button onclick="tab('media')">🖼️ Galerie & Vidéo</button></div><section id="hotels" class="card"><h2>🏨 Hôtels</h2><p>Gestion complète des hébergements.</p><div id="hotelList"></div><form id="hotelForm" class="card hidden"><h3>🏨 Fiche hôtel complète</h3><input type="hidden" id="hotelId"><input id="hotelName" placeholder="Nom de l'hôtel" required><input id="hotelPhone" placeholder="Téléphone"><input id="hotelWhatsApp" placeholder="WhatsApp"><input id="hotelWebsite" placeholder="🌐 Site web officiel"><input id="hotelPrice" placeholder="Tarif / Sur commande"><textarea id="hotelDesc" rows="5" placeholder="📝 Description"></textarea><textarea id="hotelServices" rows="4" placeholder="🛎️ Services / Hébergement"></textarea><h3>📁 Gestion des fichiers</h3><div class="filebox"><b>📸 Images de l'hôtel — plusieurs fichiers</b><input id="hotelImages" type="file" accept="image/*" multiple><div id="hotelFiles"></div><div id="hotelProgress"></div></div><div class="filebox"><b>🎥 Vidéo de l'hôtel</b><input id="hotelVideo" type="file" accept="video/mp4,video/webm,video/quicktime"><div id="hotelVideoInfo"></div><div id="hotelVideoProgress"></div></div><div class="actions"><button class="primary" type="submit">💾 Enregistrer la fiche</button><button type="button" onclick="closeHotel()">Annuler</button></div></form></section><section id="activities" class="card hidden"><h2>🏄 Activités</h2><div id="activityList"></div></section><section id="media" class="card hidden"><h2>🖼️ Galerie & Vidéo</h2><div id="mediaList"></div><form id="mediaForm" class="card hidden"><h3>Publier un média</h3><input id="mTitle" placeholder="Titre"><select id="mType"><option value="photo">📸 Photo</option><option value="video">🎥 Vidéo</option></select><textarea id="mDesc" placeholder="Description"></textarea><input id="mFile" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"><div id="mFileInfo"></div><div id="mUploadProgress"></div><button class="primary" type="submit">☁️ Publier</button></form></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-final.js"></script></body></html>
